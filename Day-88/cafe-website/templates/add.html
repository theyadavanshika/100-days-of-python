
<!DOCTYPE html>
<html>
<head>
    <title>Add a Cafe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Add a New Cafe ☕</h1>

    <form action="/add" method="POST">
        <input type="text" name="name" placeholder="Cafe name" required>

        <input type="text" name="location" placeholder="Location" required>

        <input type="url" name="map_url" placeholder="Google Maps URL" required>

        <input type="url" name="img_url" placeholder="Image URL" required>

        <input type="text" name="coffee_price" placeholder="Coffee price" required>

        <label for="wifi">Wi-Fi Available?</label>
        <select name="has_wifi" id="wifi" required>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label for="sockets">Power Sockets Available?</label>
        <select name="has_sockets" id="sockets" required>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label for="toilet">Toilet Available?</label>
        <select name="has_toilet" id="toilet" required>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label for="calls">Can Take Calls?</label>
        <select name="can_take_calls" id="calls" required>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label for="seats">Seating Capacity</label>
        <input type="text" name="seats" id="seats"
               placeholder="e.g. 20-30 seats" required>

        <button type="submit">Add Cafe</button>
    </form>

    <p><a href="/">Back to all cafes</a></p>
</body>
</html>
